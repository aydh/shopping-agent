services:
  - type: web
    name: shopping-agent
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn shopping_agent.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: COLES_API_KEY
        sync: false
      - key: WOOLWORTHS_API_KEY
        sync: false
      - key: MCP_OAUTH_CLIENT_ID
        sync: false
      - key: MCP_OAUTH_CLIENT_SECRET
        sync: false
      - key: MCP_DEFAULT_USER_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: WOOLWORTHS_PROXY_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
