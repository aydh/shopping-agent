services:
  - type: web
    name: shopping-agent
    runtime: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn shopping_agent.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COLES_API_KEY
        sync: false
      - key: DEBUG
        value: false
