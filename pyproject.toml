[project]
name = "shopping-agent"
version = "0.1.0"
description = "Smart shopping agent that manages grocery orders across Coles and Woolworths"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "starlette>=0.40,<1.0",
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "apscheduler>=3.10",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "playwright>=1.40",
    "playwright-stealth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=shopping_agent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/shopping_agent"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_empty = true
