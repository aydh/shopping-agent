{% extends "base.html" %}
{% block title %}Shopping List - Shopping Agent{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900">
            {% if shopping_list %}{{ shopping_list.name }}{% else %}Shopping List{% endif %}
        </h1>
        <div class="flex space-x-2">
            <button hx-post="/api/shopping-list/generate" hx-target="#list-content" hx-indicator="#gen-spinner"
                    class="px-4 py-2 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                Generate List
            </button>
            <span id="gen-spinner" class="htmx-indicator text-gray-400 self-center">generating...</span>
        </div>
    </div>

    <div id="list-content">
        {% include "_shopping_list_content.html" %}
    </div>
</div>
{% endblock %}
