{# Two-line price history chart for a matched Coles + Woolworths product pair.
   Context: canvas_id, coles_points, ww_points, coles_colour, ww_colour #}
<div class="bg-gray-50 px-3 sm:px-6 py-4 overflow-hidden">
  <div style="position:relative;max-width:100%">
    <canvas id="{{ canvas_id }}" height="100" role="img" aria-label="Price comparison chart between Coles and Woolworths">
      Price comparison chart between Coles and Woolworths.
    </canvas>
  </div>
  <script>
    (function() {
      const ctx = document.getElementById('{{ canvas_id }}').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Coles',
              data: {{ coles_points | tojson }},
              borderColor: '{{ coles_colour }}80',
              backgroundColor: '{{ coles_colour }}22',
              borderWidth: 2.5,
              pointBackgroundColor: '{{ coles_colour }}80',
              pointRadius: 2,
              pointHoverRadius: 3,
              stepped: true,
              parsing: { xAxisKey: 'x', yAxisKey: 'y' }
            },
            {
              label: 'Woolworths',
              data: {{ ww_points | tojson }},
              borderColor: '{{ ww_colour }}80',
              backgroundColor: '{{ ww_colour }}22',
              borderWidth: 2.5,
              pointBackgroundColor: '{{ ww_colour }}80',
              pointRadius: 2,
              pointHoverRadius: 3,
              stepped: true,
              parsing: { xAxisKey: 'x', yAxisKey: 'y' }
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            x: { type: 'time', time: { tooltipFormat: 'dd MMM yyyy', unit: 'month', displayFormats: { month: 'MMM yyyy' } }, title: { display: false } },
            y: { title: { display: true, text: 'Price ($)' }, beginAtZero: false }
          },
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, font: { size: 9 }, boxWidth: 6, boxHeight: 6, padding: 4 } }
          }
        }
      });
    })();
  </script>
</div>
