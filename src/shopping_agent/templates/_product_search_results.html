{% if not results %}
<p class="px-3 py-2 text-sm text-gray-400">No products found.</p>
{% else %}
{% for p in results %}
{% set img = p.image_url | product_image_url %}
<button type="button"
        hx-post="/api/shopping-list/items/add-product"
        hx-vals='{"product_id": {{ p.id }}}'
        hx-target="#add-product-status"
        hx-swap="innerHTML"
        hx-on::after-request="document.getElementById('add-product-input').value=''; document.getElementById('add-product-results').innerHTML='';"
        class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 flex items-center gap-3">
    {% if img %}
    <img src="{{ img }}" alt="" class="w-10 h-10 rounded object-cover flex-shrink-0">
    {% else %}
    <div class="w-10 h-10 rounded bg-gray-100 flex-shrink-0"></div>
    {% endif %}
    <div class="flex-1 min-w-0">
        <p class="truncate font-medium text-gray-900">{{ p.name }}</p>
        <p class="text-xs text-gray-400 truncate">
            {% if p.brand %}{{ p.brand }}{% endif %}
            {% if p.brand and p.unit_size %} · {% endif %}
            {% if p.unit_size %}{{ p.unit_size }}{% endif %}
        </p>
    </div>
    <div class="text-right shrink-0">
        {% if p.current_price %}
        <p class="text-sm font-semibold text-gray-800">${{ "%.2f" | format(p.current_price) }}</p>
        {% endif %}
        <p class="text-xs text-gray-400">{{ p.store.value.title() }}</p>
    </div>
</button>
{% endfor %}
{% endif %}
