{% extends "base.html" %}
{% block title %}Predictions - Shopping Agent{% endblock %}

{% block content %}
<style>
    @media (min-width: 768px) {
        .pred-header, .pred-row { display: grid; grid-template-columns: 1fr 1fr 6rem 5rem 8rem 7rem 9rem; gap: 1rem; align-items: center; }
        .pred-products { display: contents; }
        .pred-meta { display: contents; }
    }
</style>
<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <h1 class="text-2xl font-bold text-gray-900">Consumption Predictions</h1>
        <div class="flex items-center gap-2">
            <button id="show-all-ph-btn" onclick="toggleAllPriceHistories(this)"
                    class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded hover:bg-gray-200">
                Show All Price Histories
            </button>
            <button hx-post="/api/predictions/refresh" hx-target="#predictions-grid" hx-indicator="#refresh-spinner"
                    class="px-4 py-2 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                Refresh Predictions
            </button>
            <span id="refresh-spinner" class="htmx-indicator text-gray-400">refreshing...</span>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
        <div class="relative">
            <input type="text" id="predictions-search" placeholder="Search predictions..."
                   class="w-full px-4 py-2 pr-9 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <button id="predictions-search-clear" onclick="clearPredictionsSearch()"
                    class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-red-500 hover:text-red-700 focus:outline-none"
                    aria-label="Clear search">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="pred-header hidden md:grid px-4 sm:px-6 py-2 bg-gray-50 border-b border-gray-200 text-xs font-medium text-gray-500 uppercase tracking-wide">
            <div><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800">Coles</span></div>
            <div><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Woolworths</span></div>
            <div>Runout</div>
            <div>Rate</div>
            <div>Confidence</div>
            <div>Last Bought</div>
            <div></div>
        </div>
        <div id="predictions-grid" class="divide-y divide-gray-200">
            {% include "_predictions_grid.html" %}
        </div>
    </div>
</div>

<script>
function clearPredictionsSearch() {
    const field = document.getElementById('predictions-search');
    field.value = '';
    sessionStorage.setItem('predictions_search', '');
    document.getElementById('predictions-search-clear').classList.add('hidden');
    field.dispatchEvent(new Event('keyup'));
}

document.getElementById('predictions-search').addEventListener('keyup', function() {
    sessionStorage.setItem('predictions_search', this.value);
    document.getElementById('predictions-search-clear').classList.toggle('hidden', !this.value);
    const term = this.value.toLowerCase();
    document.querySelectorAll('#predictions-grid > [data-pred-id]').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
});

(function() {
    const saved = sessionStorage.getItem('predictions_search');
    if (saved) {
        const field = document.getElementById('predictions-search');
        field.value = saved;
        document.getElementById('predictions-search-clear').classList.toggle('hidden', !saved);
        field.dispatchEvent(new Event('keyup'));
    }
})();

function execScripts(container) {
    container.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        document.head.appendChild(s).parentNode.removeChild(s);
    });
}

function togglePredHistory(btn, matchId, productId, containerId) {
    const body = document.getElementById('pred-history-' + containerId);
    if (!body.classList.contains('hidden') && body.innerHTML.trim()) {
        body.innerHTML = '';
        body.classList.add('hidden');
        btn.classList.remove('text-blue-600');
    } else {
        body.classList.remove('hidden');
        btn.classList.add('text-blue-600');
        const url = matchId ? '/api/prices/history/' + matchId : '/api/prices/product-history/' + productId;
        fetch(url).then(r => r.text()).then(html => { body.innerHTML = html; execScripts(body); });
    }
}

async function loadAllPriceHistories(btn) {
    const rows = Array.from(document.querySelectorAll('#predictions-grid [data-ph-url]'));
    btn.disabled = true;
    btn.textContent = 'Loading...';

    const matchRows = {};
    const productRows = {};

    for (const row of rows) {
        const predId = row.dataset.predId;
        const body = document.getElementById('pred-history-' + predId);
        if (!body) continue;
        if (body.innerHTML.trim()) { body.classList.remove('hidden'); continue; }
        body.classList.remove('hidden');
        const url = row.dataset.phUrl;
        const matchM = url.match(/\/api\/prices\/history\/(\d+)$/);
        const productM = url.match(/\/api\/prices\/product-history\/(\d+)$/);
        if (matchM) matchRows[matchM[1]] = predId;
        else if (productM) productRows[productM[1]] = predId;
    }

    const fetches = [];
    if (Object.keys(matchRows).length) {
        fetches.push(
            fetch(`/api/prices/history/batch?ids=${Object.keys(matchRows).join(',')}`)
                .then(r => r.json())
                .then(data => {
                    for (const [id, html] of Object.entries(data)) {
                        const body = document.getElementById('pred-history-' + matchRows[id]);
                        if (body) { body.innerHTML = html; execScripts(body); }
                    }
                })
        );
    }
    if (Object.keys(productRows).length) {
        fetches.push(
            fetch(`/api/prices/product-history/batch?ids=${Object.keys(productRows).join(',')}`)
                .then(r => r.json())
                .then(data => {
                    for (const [id, html] of Object.entries(data)) {
                        const body = document.getElementById('pred-history-' + productRows[id]);
                        if (body) { body.innerHTML = html; execScripts(body); }
                    }
                })
        );
    }
    await Promise.all(fetches);

    btn.disabled = false;
    btn.textContent = 'Hide All Price Histories';
}

function toggleAllPriceHistories(btn) {
    const anyVisible = !!document.querySelector('#predictions-grid [id^="pred-history-"]:not(.hidden)');
    if (anyVisible) {
        document.querySelectorAll('#predictions-grid [id^="pred-history-"]').forEach(d => {
            d.classList.add('hidden');
        });
        btn.textContent = 'Show All Price Histories';
    } else {
        loadAllPriceHistories(btn);
    }
}
</script>
{% endblock %}
