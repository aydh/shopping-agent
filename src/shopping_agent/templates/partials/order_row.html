<tr data-order-id="{{ order.id }}" data-store-order-id="{{ order.store_order_id }}" data-order-date="{{ order.order_date }}">
    <td class="px-3 sm:px-6 py-3 text-sm text-gray-900">{{ order.order_date }}</td>
    <td class="px-3 sm:px-6 py-3 text-sm">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium {% if order.store.value == 'coles' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
            {{ order.store.value | title }}
        </span>
    </td>
    <td class="px-3 sm:px-6 py-3 text-sm text-gray-500 hidden md:table-cell">{{ order.store_order_id }}</td>
    <td class="px-3 sm:px-6 py-3 text-sm text-gray-500 hidden sm:table-cell">{{ order.items | length }}</td>
    <td class="px-3 sm:px-6 py-3 text-sm text-gray-900">${{ "%.2f" | format(order.total_amount or 0) }}</td>
    <td class="px-3 sm:px-6 py-3 text-sm text-gray-500 hidden sm:table-cell">{{ order.status or 'N/A' }}</td>
    <td class="px-3 sm:px-6 py-3 text-sm text-right">
        <button onclick="toggleOrderDetail({{ order.id }}, this)"
                title="Order details"
                class="p-1.5 bg-gray-100 text-gray-600 rounded hover:bg-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
        </button>
    </td>
</tr>
<tr id="order-detail-row-{{ order.id }}" class="hidden">
    <td colspan="7" class="px-3 sm:px-6 py-4 bg-gray-50">
        <div id="order-detail-{{ order.id }}"></div>
    </td>
</tr>
